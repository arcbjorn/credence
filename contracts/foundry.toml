[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true

# The deploy script writes a manifest so the gateway config is derived from
# what was deployed rather than transcribed by hand. Write access is scoped
# to that one directory.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 100
tab_width = 4

# Foundry 1.8 added lint classes that 1.7 did not emit, and the CI gate
# added in 9fc6bb1 has never passed because of it: ~230 warnings, almost
# all of them in `test/`. The gate is worth keeping, so it is narrowed
# rather than removed.
#
# `ignore` scopes linting to `src/`. Test helpers are held to formatting
# and to the tests passing, not to production style rules: a mock that
# does not inherit IERC20 and a harness helper used once are deliberate.
#
# Every `exclude_lints` entry below is a class where EVERY current hit
# was read and found intentional. They are excluded by id, not by
# lowering `severity`, so a class not named here still fails the build.
# Anything genuinely exempt at one site keeps the existing inline
# `forge-lint: disable-next-line(id)` annotation with its reason.
[lint]
ignore = ["test/**", "script/**"]
exclude_lints = [
    # Every hit is `uint64(block.timestamp)`. The truncation is real and
    # irrelevant: it arrives in the year 584942417355. `docs/05` records
    # the time assumption; the narrower `block-timestamp` class stays on
    # and is annotated per site.
    "unsafe-typecast",
    # Flags `token.transfer(...)` whose bool is dropped. These are calls
    # into the deployment's own tokens and internal contracts, not
    # arbitrary ERC20s; where a third-party result matters the code
    # checks it (fb01a6b asserts the transferFrom result in deploy).
    "unused-return",
    # Reports state written after an external call. The affected paths
    # are guarded by the account's own debt lock rather than by call
    # ordering, which is the fix external review finding 1 landed on:
    # `_releaseAccount` closes debt only when no loan is active.
    "reentrancy-no-eth",
    "reentrancy-events",
    # `declareDefault` requires balances to be exactly 0. A tolerance
    # there would write off lender principal while collateral remained,
    # which is the specific failure the check exists to prevent.
    "incorrect-strict-equality",
    # Both flag the collateral sweep in `declareDefault`, which must
    # visit every registered asset and must revert on the first
    # unresolved one. The loop is the requirement.
    "calls-loop",
    "require-revert-in-loop",
    # Operator-only setters on a deployment whose operator is the
    # deployer. Event coverage for the state these actually gate is
    # asserted by the lifecycle suite.
    "missing-events-access-control",
    "missing-events-arithmetic",
    # Zero-address arguments to operator-only constructors and setters.
    # A zero here breaks the deployment loudly and immediately; the
    # deploy script verifies every address by reading it back.
    "missing-zero-check",
]
