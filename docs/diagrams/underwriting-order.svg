<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="ui-sans-serif,system-ui,sans-serif">
<style>
 .s1{fill:#fbfbfd;stroke:#c7c9d1;stroke-width:1.2;rx:5}
 .gate{fill:#fef2f2;stroke:#dc2626;stroke-width:1.4;rx:5}
 .out{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5;rx:5}
 .t{font-size:11px;fill:#18181b}.n{font-size:10px;fill:#a1a1aa}
 .s{font-size:10px;fill:#71717a}
 .a{stroke:#6b7280;stroke-width:1.2;fill:none;marker-end:url(#h)}
 @media (prefers-color-scheme:dark){
  .s1{fill:#1c1c20;stroke:#3f3f46}.gate{fill:#450a0a;stroke:#f87171}
  .out{fill:#1e1b4b;stroke:#818cf8}.t{fill:#e4e4e7}.s{fill:#a1a1aa}.a{stroke:#9ca3af}}
</style>
<defs><marker id="h" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6b7280" stroke-width="1.2"/></marker></defs>

<text x="40" y="18" class="t">Origination assessment</text>
<rect class="s1 gate" x="40" y="30" width="420" height="30"/><text x="16" y="50" class="n">1</text><text x="54" y="49" class="t">Validate binding, units, coverage, freshness, supported assets</text>
<rect class="s1 gate" x="40" y="68" width="420" height="30"/><text x="16" y="88" class="n">2</text><text x="54" y="87" class="t">Validate assessment kind, request, and intended action</text>
<rect class="s1" x="40" y="106" width="420" height="30"/><text x="16" y="126" class="n">3</text><text x="54" y="125" class="t">Mark value · recoverable value under three named shocks</text>
<rect class="s1" x="40" y="144" width="420" height="30"/><text x="16" y="164" class="n">4</text><text x="54" y="163" class="t">Reserve full-term interest; deduct closeout costs once</text>
<rect class="s1" x="40" y="182" width="420" height="30"/><text x="16" y="202" class="n">5</text><text x="54" y="201" class="t">Maximum safe principal on the post-action portfolio</text>
<rect class="s1" x="40" y="220" width="420" height="30"/><text x="16" y="240" class="n">6</text><text x="54" y="239" class="t">Apply history, continuity, concentration, utilization, caps</text>
<rect class="s1" x="40" y="258" width="420" height="30"/><text x="16" y="278" class="n">7</text><text x="54" y="277" class="t">Forecast cap; maximum penalty for insufficient outcomes</text>
<rect class="s1" x="40" y="296" width="420" height="30"/><text x="16" y="316" class="n">8</text><text x="54" y="315" class="t">Price with versioned policy; respect borrower APR ceiling</text>
<rect class="s1 out" x="40" y="334" width="420" height="30"/><text x="16" y="354" class="n">9</text><text x="54" y="353" class="t">Approve exact request · Deny · Unavailable + reasons</text>

<line class="a" x1="240" y1="60" x2="240" y2="66"/><line class="a" x1="240" y1="98" x2="240" y2="104"/>
<line class="a" x1="240" y1="136" x2="240" y2="142"/><line class="a" x1="240" y1="174" x2="240" y2="180"/>
<line class="a" x1="240" y1="212" x2="240" y2="218"/><line class="a" x1="240" y1="250" x2="240" y2="256"/>
<line class="a" x1="240" y1="288" x2="240" y2="294"/><line class="a" x1="240" y1="326" x2="240" y2="332"/>

<path class="a" d="M460,45 L494,45 L494,349 L462,349"/>
<text x="520" y="42" class="t">Unavailable → blocked permission</text>
<text x="520" y="60" class="s">Required evidence missing, stale,</text>
<text x="520" y="76" class="s">conflicting, or unsupported: no terms.</text>
<text x="520" y="98" class="s">Optional enrichment absent: omit it.</text>
<text x="520" y="114" class="s">Never substitute synthetic evidence.</text>

<rect class="s1" x="520" y="144" width="264" height="162"/>
<text x="534" y="164" class="t">drawable_capacity = min(</text>
<text x="534" y="184" class="s">  agent_capacity,</text>
<text x="534" y="200" class="s">  debt_headroom_capacity,</text>
<text x="534" y="216" class="s">  remaining strategy/vault budgets,</text>
<text x="534" y="232" class="s">  available_cash)</text>
<text x="534" y="254" class="s">Apply origination gates separately.</text>
<text x="534" y="276" class="t">Approved principal = requested principal</text>
<text x="534" y="294" class="s">only when the exact request is eligible.</text>

<rect class="s1" x="40" y="390" width="744" height="36"/>
<text x="54" y="412" class="t">Monitoring evaluates the existing loan and updates permission only; it never grants principal or loan terms.</text>
</svg>
