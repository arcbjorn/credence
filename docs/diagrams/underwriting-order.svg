<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="ui-sans-serif,system-ui,sans-serif">
<style>
 .s1{fill:#fbfbfd;stroke:#c7c9d1;stroke-width:1.2;rx:5}
 .gate{fill:#fef2f2;stroke:#dc2626;stroke-width:1.4;rx:5}
 .out{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5;rx:5}
 .t{font-size:11.5px;fill:#18181b}.n{font-size:10px;fill:#a1a1aa}
 .s{font-size:9.5px;fill:#71717a}
 .a{stroke:#6b7280;stroke-width:1.2;fill:none;marker-end:url(#h)}
 @media (prefers-color-scheme:dark){
  .s1{fill:#1c1c20;stroke:#3f3f46}.gate{fill:#450a0a;stroke:#f87171}
  .out{fill:#1e1b4b;stroke:#818cf8}.t{fill:#e4e4e7}.s{fill:#a1a1aa}.a{stroke:#9ca3af}}
</style>
<defs><marker id="h" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6b7280" stroke-width="1.2"/></marker></defs>

<rect class="s1 gate" x="40" y="14" width="400" height="30"/><text x="16" y="34" class="n">1</text><text x="54" y="33" class="t">Validate binding, units, coverage, freshness, supported assets</text>
<rect class="s1 gate" x="40" y="52" width="400" height="30"/><text x="16" y="72" class="n">2</text><text x="54" y="71" class="t">Validate request and intended action against account policy</text>
<rect class="s1" x="40" y="90" width="400" height="30"/><text x="16" y="110" class="n">3</text><text x="54" y="109" class="t">Mark value · recoverable value under three named shocks</text>
<rect class="s1" x="40" y="128" width="400" height="30"/><text x="16" y="148" class="n">4</text><text x="54" y="147" class="t">Reserve max full-term interest, execution cost, keeper fee</text>
<rect class="s1" x="40" y="166" width="400" height="30"/><text x="16" y="186" class="n">5</text><text x="54" y="185" class="t">Max safe draw on the POST-ACTION portfolio</text>
<rect class="s1" x="40" y="204" width="400" height="30"/><text x="16" y="224" class="n">6</text><text x="54" y="223" class="t">Apply history, continuity, concentration, utilization, caps</text>
<rect class="s1" x="40" y="242" width="400" height="30"/><text x="16" y="262" class="n">7</text><text x="54" y="261" class="t">Bounded forecast penalty (cannot relax the stress floor)</text>
<rect class="s1" x="40" y="280" width="400" height="30"/><text x="16" y="300" class="n">8</text><text x="54" y="299" class="t">Price with the versioned policy schedule</text>
<rect class="s1 out" x="40" y="318" width="400" height="30"/><text x="16" y="338" class="n">9</text><text x="54" y="337" class="t">Approve · Deny · Unavailable + binding_constraints[]</text>

<line class="a" x1="240" y1="44" x2="240" y2="50"/><line class="a" x1="240" y1="82" x2="240" y2="88"/>
<line class="a" x1="240" y1="120" x2="240" y2="126"/><line class="a" x1="240" y1="158" x2="240" y2="164"/>
<line class="a" x1="240" y1="196" x2="240" y2="202"/><line class="a" x1="240" y1="234" x2="240" y2="240"/>
<line class="a" x1="240" y1="272" x2="240" y2="278"/><line class="a" x1="240" y1="310" x2="240" y2="316"/>

<path class="a" d="M440,29 L500,29 L500,333 L442,333"/>
<path class="a" d="M440,67 L480,67 L480,333"/>
<text x="510" y="26" class="t">Unavailable</text>
<text x="510" y="42" class="s">missing or stale evidence</text>
<text x="510" y="56" class="s">never yields terms</text>

<rect class="s1" x="510" y="150" width="152" height="88"/>
<text x="524" y="170" class="t">approved_principal</text>
<text x="524" y="188" class="s">= min(stress_capacity,</text>
<text x="524" y="202" class="s">history_growth_cap,</text>
<text x="524" y="216" class="s">hard_cap, budgets,</text>
<text x="524" y="230" class="s">available_cash)</text>
</svg>
