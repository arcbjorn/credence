<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="ui-sans-serif,system-ui,sans-serif">
<style>
 .b{fill:#fbfbfd;stroke:#c7c9d1;stroke-width:1.2;rx:6}
 .core{fill:#eef2ff;stroke:#6366f1;stroke-width:1.6}
 .chain{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.4}
 .ext{fill:#fff;stroke:#d4d4d8;stroke-dasharray:4 3}
 .t{font-size:12px;fill:#18181b}
 .s{font-size:10px;fill:#65748b}
 .lbl{font-size:9.5px;fill:#8b8b96}
 .a{stroke:#6b7280;stroke-width:1.3;fill:none;marker-end:url(#h)}
 .ad{stroke:#b4b7c0;stroke-width:1.1;fill:none;stroke-dasharray:4 3;marker-end:url(#hd)}
 @media (prefers-color-scheme:dark){
  .b{fill:#1c1c20;stroke:#3f3f46}.core{fill:#1e1b4b;stroke:#818cf8}
  .chain{fill:#052e16;stroke:#4ade80}.ext{fill:#18181b;stroke:#3f3f46}
  .t{fill:#e4e4e7}.s{fill:#a1a1aa}.lbl{fill:#71717a}
  .a{stroke:#9ca3af}.ad{stroke:#52525b}
 }
</style>
<defs>
