<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="ui-sans-serif,system-ui,sans-serif">
<style>
 .n{fill:#fbfbfd;stroke:#c7c9d1;stroke-width:1.3;rx:5}
 .ok{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5}
 .bad{fill:#fef2f2;stroke:#dc2626;stroke-width:1.5}
 .mid{fill:#fffbeb;stroke:#d97706;stroke-width:1.5}
 .t{font-size:12px;fill:#18181b}.s{font-size:9.5px;fill:#71717a}
 .a{stroke:#6b7280;stroke-width:1.3;fill:none;marker-end:url(#h)}
 .lbl{font-size:9.5px;fill:#65748b}
 @media (prefers-color-scheme:dark){
  .n{fill:#1c1c20;stroke:#3f3f46}.ok{fill:#052e16;stroke:#4ade80}
  .bad{fill:#450a0a;stroke:#f87171}.mid{fill:#451a03;stroke:#fbbf24}
  .t{fill:#e4e4e7}.s{fill:#a1a1aa}.lbl{fill:#a1a1aa}.a{stroke:#9ca3af}}
</style>
<defs><marker id="h" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#6b7280" stroke-width="1.2"/></marker></defs>

<rect class="n" x="14" y="118" width="104" height="40"/><text x="30" y="143" class="t">NoLoan</text>
<rect class="n" x="186" y="118" width="104" height="40"/><text x="212" y="143" class="t">Active</text>
<rect class="n ok" x="358" y="40" width="120" height="40"/><text x="382" y="65" class="t">Repaid</text>
<rect class="n mid" x="358" y="118" width="120" height="40"/><text x="370" y="138" class="t">Recovery</text><text x="370" y="152" class="s">Pending</text>
<rect class="n ok" x="542" y="88" width="126" height="40"/><text x="560" y="113" class="t">Recovered</text>
<rect class="n bad" x="542" y="164" width="126" height="40"/><text x="560" y="184" class="t">Defaulted</text><text x="560" y="197" class="s">loss → vault ledger</text>

<line class="a" x1="118" y1="138" x2="184" y2="138"/>
<text x="118" y="130" class="lbl">assessment</text><text x="118" y="119" class="lbl">+ equity + cash</text>

<path class="a" d="M290,130 L320,130 L320,60 L356,60"/>
<text x="296" y="80" class="lbl">full repayment</text>

<line class="a" x1="290" y1="146" x2="356" y2="140"/>
<text x="288" y="166" class="lbl">health breach</text><text x="288" y="177" class="lbl">or maturity</text>

<path class="a" d="M478,130 L508,130 L508,108 L540,108"/>
<text x="478" y="100" class="lbl">debt collected</text>

<path class="a" d="M478,146 L508,146 L508,184 L540,184"/>
<text x="478" y="212" class="lbl">assets exhausted</text>

<path class="a" d="M418,158 L418,186 L400,186 L400,172 L418,172" stroke-dasharray="3 3"/>
<text x="330" y="196" class="lbl">no liquidity → stays pending</text>

<rect class="n" x="14" y="230" width="654" height="54"/>
<text x="28" y="250" class="t">Invariant while Active or RecoveryPending</text>
<text x="28" y="268" class="s">Neither agent nor owner may withdraw · adapters cannot redirect proceeds · collection accounting is idempotent</text>
</svg>
