# Every suite, on every push and pull request.
#
# `docs/10` commits to re-running acceptance before every merge from 22
# September. This starts that discipline early and mechanically: at the
# rate this repository moves, a broken `main` between two commits is
# otherwise invisible until someone clones it. Reported by review, 14
# September -- `main` was observed transiently broken during the review
# itself.
#
# The three languages run as separate jobs so a Rust failure does not
# hide a Solidity one: the point is to see everything that broke, not the
# first thing.
name: test

on:
  push:
    branches: [master]
  pull_request:

# A newer push supersedes an in-flight run for the same ref. The old
# result describes code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: solidity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `stable`. `stable` moved 1.7 -> 1.8 and brought new
      # lint classes with it, which broke `master` on a day nobody
      # touched Solidity. It also meant the lint gate could only be
      # reproduced by pushing: locally `forge lint` emitted nothing,
      # because 1.7 knows none of the classes 1.8 reports. Same reason
      # forge-std is pinned below -- an unpinned dependency makes a
      # green run mean a different thing on different days.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      # forge-std is pinned rather than vendored, so a clean checkout
      # cannot compile without fetching it. Same script a developer runs.
      - name: fetch pinned dependencies
        run: |
          git clone --quiet --depth 1 --branch v1.16.2 \
            https://github.com/foundry-rs/forge-std contracts/lib/forge-std
          mkdir -p contracts/deployments
      # Solidity was the one language with no formatting gate, and it had
      # drifted from its own `foundry.toml` (line_length = 100) across 20
      # files. Reformatting was verified to leave runtime bytecode
      # byte-identical, so this gate is cosmetic-only by construction.
      - name: forge fmt
        run: forge fmt --check
        working-directory: contracts
      - name: forge build
        run: forge build
        working-directory: contracts
      # Zero warnings, so a new one is visible instead of lost in a wall
      # of accepted ones. Every current exemption is annotated in place
      # with its reason; `docs/05` records the block.timestamp rationale.
      - name: forge lint
        run: |
          out=$(forge lint 2>&1)
          echo "$out"
          if echo "$out" | grep -qE '^warning\['; then
            echo "::error::forge lint reported warnings" >&2
            exit 1
          fi
        working-directory: contracts
      # `forge lint` can leave the build cache in a state where `forge
      # test` silently discovers fewer suites -- observed twice, 191 tests
      # dropping to 131 with no error. A clean build makes the count
      # trustworthy.
      - name: forge test
        run: forge clean && forge test -vv
        working-directory: contracts

  engine:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: risk
      - name: cargo fmt
        run: cargo fmt --check
        working-directory: risk
      # Warnings fail here. The engine is the part whose output is
      # hashed and signed, so an unused-result warning there is worth
      # stopping for.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: risk
      - name: cargo test
        run: cargo test
        working-directory: risk

  gateway:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      # Matches the rust job's `cargo fmt --check`. Without it the two
      # languages held different standards and eight gateway files had
      # drifted unnoticed.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
        working-directory: gateway
      - name: go vet
        run: go vet ./...
        working-directory: gateway
      # -race, because the gateway runs a scheduler loop beside a
      # publisher and the store is shared between them.
      - name: go test
        # `-count=1` disables the test cache. Without it a warm cache can
        # report a stale pass: the committed canonicalization vector broke
        # on 14 September and `go test ./...` still said ok.
        run: go test -race -count=1 ./...
        working-directory: gateway

  workflow:
    name: cre workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cre/go.mod
          cache-dependency-path: cre/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
        working-directory: cre
      - name: go vet
        run: go vet ./underwrite/
        working-directory: cre
      - name: go test
        run: go test -count=1 ./underwrite/
        working-directory: cre

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cited counts drift when something is ADDED, which is the direction
      # nothing else warns about: two documents said the CRE receiver had
      # 19 tests after it grew to 21.
      - name: cited counts
        run: bash scripts/check-docs.sh

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The engine is a build artifact of risk/crates/risk-wasm, not a
      # committed file: a second copy could fall behind the first.
      - name: install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: build the engine
        run: bash scripts/build-wasm.sh

      # Generate the data bundle, so the data-dependent suites RUN.
      #
      # Without it, 19 of 38 web tests `skipIf` themselves away and CI
      # reports green while testing half the interface -- including every
      # assertion about the comparison screen and the replay pair. The
      # demos need a chain and the Go toolchain, so this installs both;
      # `build-web-data.sh` then bundles whatever they retained.
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      # Pinned to match the solidity job: the demos deploy the same
      # contracts, so two toolchains would let them disagree.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: fetch pinned dependencies
        run: |
          git clone --quiet --depth 1 --branch v1.16.2 \
            https://github.com/foundry-rs/forge-std contracts/lib/forge-std
          mkdir -p contracts/deployments
      - name: run the demos
        run: |
          anvil --port 8546 --silent &
          for _ in $(seq 40); do
            cast chain-id --rpc-url http://127.0.0.1:8546 >/dev/null 2>&1 && break
            sleep 0.5
          done
          bash scripts/setup.sh
          LOANS=3 bash scripts/demo-repay.sh
          bash scripts/demo-monitor.sh
      - name: bundle the evidence
        run: bash scripts/build-web-data.sh

      - name: install
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: typecheck
        run: pnpm exec tsc -b --noEmit
        working-directory: web
      # Required, not optional: a missing bundle fails here rather than
      # skipping 19 of 38 tests and reporting green.
      - name: test
        run: pnpm test
        working-directory: web
        env:
          CREDENCE_REQUIRE_FIXTURES: '1'
      - name: build
        run: pnpm build
        working-directory: web
