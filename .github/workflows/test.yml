# Every suite, on every push and pull request.
#
# `docs/10` commits to re-running acceptance before every merge from 22
# September. This starts that discipline early and mechanically: at the
# rate this repository moves, a broken `main` between two commits is
# otherwise invisible until someone clones it. Reported by review, 14
# September -- `main` was observed transiently broken during the review
# itself.
#
# The three languages run as separate jobs so a Rust failure does not
# hide a Solidity one: the point is to see everything that broke, not the
# first thing.
name: test

on:
  push:
    branches: [master]
  pull_request:

# A newer push supersedes an in-flight run for the same ref. The old
# result describes code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: solidity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `stable`. `stable` moved 1.7 -> 1.8 and brought new
      # lint classes with it, which broke `master` on a day nobody
      # touched Solidity. It also meant the lint gate could only be
      # reproduced by pushing: locally `forge lint` emitted nothing,
      # because 1.7 knows none of the classes 1.8 reports. Same reason
      # forge-std is pinned below -- an unpinned dependency makes a
      # green run mean a different thing on different days.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      # forge-std is pinned rather than vendored, so a clean checkout
      # cannot compile without fetching it. Same script a developer runs.
      - name: fetch pinned dependencies
        run: |
          git clone --quiet --depth 1 --branch v1.16.2 \
            https://github.com/foundry-rs/forge-std contracts/lib/forge-std
          mkdir -p contracts/deployments
      # Solidity was the one language with no formatting gate, and it had
      # drifted from its own `foundry.toml` (line_length = 100) across 20
      # files. Reformatting was verified to leave runtime bytecode
      # byte-identical, so this gate is cosmetic-only by construction.
      - name: forge fmt
        run: forge fmt --check
        working-directory: contracts
      # Lint BEFORE build, so the build it leaves behind is the one the
      # tests use.
      #
      # `forge lint` was once able to leave the build cache in a state
      # where `forge test` silently discovered fewer suites -- 191 tests
      # dropping to 131 with no error -- and the fix was `forge clean &&
      # forge test`, which threw away a 43s build on every run. Running
      # lint first makes the clean unnecessary: verified on 1.8.3 that
      # lint -> build -> test finds all 14 suites and 202 tests.
      #
      # Zero warnings, so a new one is visible instead of lost in a wall
      # of accepted ones. Every current exemption is annotated in place
      # with its reason; `docs/05` records the block.timestamp rationale.
      - name: forge lint
        run: |
          out=$(forge lint 2>&1)
          echo "$out"
          if echo "$out" | grep -qE '^warning\['; then
            echo "::error::forge lint reported warnings" >&2
            exit 1
          fi
        working-directory: contracts
      - name: forge build
        run: forge build
        working-directory: contracts
      # The suite count is asserted, not assumed: if the cache ever
      # silently drops suites again, this fails loudly rather than
      # reporting green on half the tests.
      - name: forge test
        run: |
          out=$(forge test -vv 2>&1)
          echo "$out"
          suites=$(echo "$out" | grep -oE 'Ran [0-9]+ test suites' | grep -oE '[0-9]+' | tail -1)
          if [ "${suites:-0}" -lt 14 ]; then
            echo "::error::expected at least 14 test suites, ran ${suites:-0}" >&2
            exit 1
          fi
        working-directory: contracts

  engine:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: risk
      - name: cargo fmt
        run: cargo fmt --check
        working-directory: risk
      # Warnings fail here. The engine is the part whose output is
      # hashed and signed, so an unused-result warning there is worth
      # stopping for.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: risk
      - name: cargo test
        run: cargo test
        working-directory: risk

  gateway:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      # Matches the rust job's `cargo fmt --check`. Without it the two
      # languages held different standards and eight gateway files had
      # drifted unnoticed.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
        working-directory: gateway
      - name: go vet
        run: go vet ./...
        working-directory: gateway
      # -race, because the gateway runs a scheduler loop beside a
      # publisher and the store is shared between them.
      - name: go test
        # `-count=1` disables the test cache. Without it a warm cache can
        # report a stale pass: the committed canonicalization vector broke
        # on 14 September and `go test ./...` still said ok.
        run: go test -race -count=1 ./...
        working-directory: gateway

  workflow:
    name: cre workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cre/go.mod
          cache-dependency-path: cre/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
        working-directory: cre
      - name: go vet
        run: go vet ./underwrite/
        working-directory: cre
      - name: go test
        run: go test -count=1 ./underwrite/
        working-directory: cre

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cited counts drift when something is ADDED, which is the direction
      # nothing else warns about: two documents said the CRE receiver had
      # 19 tests after it grew to 21.
      - name: cited counts
        run: bash scripts/check-docs.sh

  indexer:
    name: indexer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` -- action-setup then takes it from the project's
      # `packageManager` field, so CI and a developer run the same pnpm.
      # They did not: pnpm 11 stopped reading the `pnpm` field in
      # package.json that pnpm 10 still honoured, and the frozen install
      # failed on a config the lockfile recorded and the config no longer
      # declared.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: indexer/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: indexer/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
        working-directory: indexer
      # The handlers are typed against entities codegen writes from
      # config.yaml and schema.graphql, so this also checks that the
      # three agree: a field renamed in the schema and not in a handler
      # fails here rather than at sync time.
      - name: codegen
        run: pnpm codegen
        working-directory: indexer
      - name: typecheck
        run: pnpm typecheck
        working-directory: indexer
      - name: test
        run: pnpm test
        working-directory: indexer

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # This job compiles the Rust TWICE -- once to wasm for the engine,
      # once natively inside `scripts/setup.sh`, which the demos need for
      # `credence-risk-service` and `credence-risk`. Both land in the same
      # target directory, so one cache covers both; it is keyed apart from
      # the `rust` job because that job's cache holds test artifacts this
      # one never builds, and sharing would thrash both.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: risk
          key: wasm-and-native
          # Cache even when the job fails: a red run still leaves a warm
          # target directory, and the next attempt should not pay for the
          # compile again.
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The engine is a build artifact of risk/crates/risk-wasm, not a
      # committed file: a second copy could fall behind the first.
      # A prebuilt binary, not `cargo install`.
      #
      # Compiling wasm-bindgen-cli from source took 190s -- HALF this
      # workflow's wall-clock time, since `web` is the long pole and the
      # other six jobs finish inside it. The published musl binary for
      # the same pinned version installs in about a second.
      #
      # Falls back to building from source if the download fails: a
      # release CDN can 504 (the foundry toolchain did exactly that on
      # 21 September), and a transient outage should cost time, not a
      # red build.
      - name: install wasm-bindgen
        run: |
          set -euo pipefail
          VERSION=0.2.128
          TARBALL=wasm-bindgen-$VERSION-x86_64-unknown-linux-musl
          URL=https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$VERSION/$TARBALL.tar.gz
          if curl --retry 3 --retry-connrefused --fail --silent --show-error \
            --location "$URL" -o /tmp/wasm-bindgen.tar.gz; then
            tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
            install -m755 "/tmp/$TARBALL/wasm-bindgen" "$HOME/.cargo/bin/wasm-bindgen"
          else
            echo "prebuilt download failed; building from source"
            cargo install wasm-bindgen-cli --version "$VERSION" --locked
          fi
          # Whichever path ran, the version must be the pinned one: the
          # engine artifact this produces is hashed and compared.
          wasm-bindgen --version
      - name: build the engine
        run: bash scripts/build-wasm.sh

      # Generate the data bundle, so the data-dependent suites RUN.
      #
      # Without it, 19 of 38 web tests `skipIf` themselves away and CI
      # reports green while testing half the interface -- including every
      # assertion about the comparison screen and the replay pair. The
      # demos need a chain and the Go toolchain, so this installs both;
      # `build-web-data.sh` then bundles whatever they retained.
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      # Pinned to match the solidity job: the demos deploy the same
      # contracts, so two toolchains would let them disagree.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: fetch pinned dependencies
        run: |
          git clone --quiet --depth 1 --branch v1.16.2 \
            https://github.com/foundry-rs/forge-std contracts/lib/forge-std
          mkdir -p contracts/deployments
      # `scripts/setup.sh` rebuilds all three languages inside the demo
      # step below. Rust is cached above; Solidity was not, so `forge
      # build` recompiled 17 contracts on every run. Keyed on the sources
      # and the pinned forge-std, so a contract change busts it.
      - uses: actions/cache@v4
        with:
          path: |
            contracts/out
            contracts/cache
          key: forge-${{ runner.os }}-v1.8.3-${{ hashFiles('contracts/src/**/*.sol', 'contracts/foundry.toml') }}
          restore-keys: forge-${{ runner.os }}-v1.8.3-
      - name: run the demos
        run: |
          anvil --port 8546 --silent &
          for _ in $(seq 40); do
            cast chain-id --rpc-url http://127.0.0.1:8546 >/dev/null 2>&1 && break
            sleep 0.5
          done
          bash scripts/setup.sh
          LOANS=3 bash scripts/demo-repay.sh
          bash scripts/demo-monitor.sh
          # The defaulted epoch. Without it `default.json` is absent, the
          # lender-loss suite skips itself, and CI reports green while the
          # one screen that shows a lender loss goes unchecked.
          bash scripts/demo-default.sh
      - name: bundle the evidence
        run: bash scripts/build-web-data.sh

      - name: install
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: typecheck
        run: pnpm exec tsc -b --noEmit
        working-directory: web
      # Required, not optional: a missing bundle fails here rather than
      # skipping 19 of 38 tests and reporting green.
      - name: test
        run: pnpm test
        working-directory: web
        env:
          CREDENCE_REQUIRE_FIXTURES: '1'
      - name: build
        run: pnpm build
        working-directory: web
